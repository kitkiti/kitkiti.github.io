    Projects:
      - name: HyperCite - AI Research Summarization & Collaboration Hub
        url: https://hypercite.vercel.app
        summary: Collaborative research platform for grounded AI assistance, paper organization, and source-anchored citation verification.
        highlights:
          - Ranked first among 120+ projects at the BRACU CSE471 System Analysis and Design Project Showcase in Fall 2025.
          - Built a hybrid RAG pipeline combining MongoDB Atlas vector search with lexical fallback and cross-paper chunk diversification.
          - Implemented page-level, excerpt-anchored citations and real-time collaborative annotation with Liveblocks.
          - Built with React, TypeScript, Node.js, Express, MongoDB, Supabase, and Liveblocks.

      - name: Mewply - Music Streaming Platform
        url: https://github.com/kitkiti/Music-Streaming-App
        summary: MERN music-streaming platform with separate user, administration, and backend applications.
        highlights:
          - Designed REST APIs following MVC patterns with JWT and Bcrypt authentication.
          - Built responsive audio playback and playlist management.
          - Integrated Cloudinary for media storage and streaming.

      - name: HambaMart - Livestock E-commerce Platform
        url: https://github.com/kitkiti/HambaMart
        summary: Django marketplace supporting buyers, sellers, administrators, products, transactions, and inventory workflows.
        highlights:
          - Designed the EER diagram and relational database schema.
          - Implemented filtered search using Django ORM.
          - Added role-based access control and a template-driven frontend.

